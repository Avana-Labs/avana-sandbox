version: 2
updates:
  # npm dependencies — weekly grouped PRs to keep the churn manageable.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bundle routine minor/patch bumps into a single PR; majors still land
      # individually so breaking changes are reviewed on their own.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # wagmi major (2 -> 3) is blocked by ConnectKit, which still pins
      # wagmi@2.x and calls hooks renamed in v3. Revisit when ConnectKit
      # ships wagmi 3 support. Minor/patch wagmi bumps still flow through.
      - dependency-name: "wagmi"
        update-types:
          - "version-update:semver-major"

  # Keep GitHub Actions themselves current (checkout, setup-node, etc.).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

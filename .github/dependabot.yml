version: 2
updates:
  # npm dependencies — weekly grouped PRs to keep the churn manageable.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bundle routine minor/patch bumps into a single PR; majors still land
      # individually so breaking changes are reviewed on their own.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions themselves current (checkout, setup-node, etc.).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

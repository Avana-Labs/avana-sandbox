version: 2
updates:
  # npm dependencies — weekly grouped PRs to keep the churn manageable.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bundle routine minor/patch bumps into a single PR; majors still land
      # individually so breaking changes are reviewed on their own.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Keep major framework/runtime migrations out of routine Dependabot churn.
      # These need coordinated app-level migration work instead of isolated PRs.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "web-vitals"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "zod"
        update-types:
          - "version-update:semver-major"
      # wagmi 3 is a coordinated migration alongside viem/connectkit, not an
      # isolated bump — the v2->v3 PR broke the build.
      - dependency-name: "wagmi"
        update-types:
          - "version-update:semver-major"
      # Tailwind 4 is a CSS-first engine rewrite; tailwind-merge 3 targets the
      # v4 class taxonomy. Both move together as a deliberate migration.
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tailwind-merge"
        update-types:
          - "version-update:semver-major"
      # jest-dom majors drop older-runtime support; upgrade deliberately, not
      # as routine churn.
      - dependency-name: "@testing-library/jest-dom"
        update-types:
          - "version-update:semver-major"

  # Keep GitHub Actions themselves current (checkout, setup-node, etc.).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

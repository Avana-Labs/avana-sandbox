name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rolldown Linux binding
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" \
            || npm install --no-save @rolldown/binding-linux-x64-gnu@$(node -p "require('./package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu'] || require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")

      - name: Format check
        run: npm run format:check

      - name: Security check
        run: npm run security:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rolldown Linux binding
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" \
            || npm install --no-save @rolldown/binding-linux-x64-gnu@$(node -p "require('./package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu'] || require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Install the Chromium *browser* only. We deliberately do NOT use
      # `--with-deps` here: that shells out to apt, which intermittently hangs for
      # the full job budget on hosted runners, and ubuntu-latest already ships the
      # libraries Chromium needs. The browser download (fast, reliable CDN) is
      # wrapped in a bounded retry; on a cache hit it's skipped entirely.
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            for attempt in 1 2 3; do
              echo "playwright install chromium (attempt ${attempt})"
              timeout 180 npx playwright install chromium && break
              [ "${attempt}" = "3" ] && { echo "::error::browser install failed after 3 attempts"; exit 1; }
              echo "::warning::browser install attempt ${attempt} timed out/failed; retrying"
              sleep 5
            done
          fi

      # System libs as a best-effort safety net: bounded and non-fatal so apt can
      # never hang or fail the job (ubuntu-latest normally already has them).
      - name: Install Playwright system deps (best effort)
        shell: bash
        run: timeout 120 npx playwright install-deps chromium || echo "::warning::install-deps skipped (timeout/failure); relying on preinstalled runner libs"

      # Playwright's webServer (playwright.config.ts) boots `npm run dev` with
      # NEXT_PUBLIC_PLAYWRIGHT_TEST_MODE=1, which opens the onboarding gate,
      # injects the test wallet, and serves mock data — so this needs neither a
      # Convex deployment nor a SIWE token. Scoped to the deterministic specs:
      #   - portfolio-routing: the portfolio page renders its product account tabs,
      #     and the old /dashboard and /rewards routes redirect to /portfolio.
      #   - borrow-detail-routes: every borrow detail route family renders without
      #     a runtime error (guards the hydration regression fixed in
      #     responsive-detail-action.tsx).
      # Both are JSON-import-free (the JSON fixture in action-pages/route-performance
      # trips Playwright's transform hook) and free of timing/pixel assertions.
      # onboarding.spec.ts stays out (needs real auth + Convex).
      - name: E2E smoke (test-mode routes render)
        run: npx playwright test --project=chromium tests/e2e/portfolio-routing.spec.ts tests/e2e/borrow-detail-routes.spec.ts tests/e2e/locale-overflow.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

# NOTE: CI's required gate is the `test` job — lint + typecheck + the full
# unit/integration suite (`npm test`) — run on every PR into main and on push to
# main. `e2e-smoke` is a scoped Playwright smoke (see the step comment) kept as a
# separate, non-required job for now; promote it to a required check once it has
# proven stable. The timing/pixel-sensitive e2e suites (route-performance,
# app-audit) and onboarding.spec.ts remain local-only: they need a running Convex
# backend and/or a signed-in wallet, which CI does not provision. Run them against
# `npm run dev` (NEXT_PUBLIC_PLAYWRIGHT_TEST_MODE=1 + a SIWE token + `npx convex dev`).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static checks (format + security + lint + typecheck) run once, in parallel
  # with the sharded unit tests below.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Ensure rolldown Linux binding
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" \
            || npm install --no-save @rolldown/binding-linux-x64-gnu@$(node -p "require('./package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu'] || require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")

      - name: Format check
        run: npm run format:check

      - name: Security check
        run: npm run security:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  # Unit/integration suite (~400 specs) sharded across parallel runners so the
  # slowest job is roughly the suite time divided by the shard count.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Ensure rolldown Linux binding
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" \
            || npm install --no-save @rolldown/binding-linux-x64-gnu@$(node -p "require('./package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu'] || require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")

      - name: Unit tests (shard ${{ matrix.shard }})
        run: npx vitest run --shard=${{ matrix.shard }}

  # Live-model evaluation of the Ask AI agent (app/lib/ask-ai/__tests__/live-model-evals.test.ts).
  # These specs call a real OpenAI model, so they are gated behind BOTH an env
  # flag (RUN_ASK_AI_LIVE_EVALS=1) and the presence of an API key — without the
  # key the test file self-skips (describe.skip), so the step is a no-op rather
  # than a failure.
  #
  # SECRET REQUIRED: add a repository secret named `OPENAI_API_KEY` for this job
  # to actually run. Until it is added, `env.OPENAI_API_KEY` is empty, the guard
  # below skips the eval step, and the job passes trivially. This job is kept
  # separate and NON-required on purpose (real network + cost + non-determinism);
  # it must never block a PR.
  ask-ai-live-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `secrets` cannot be referenced in an `if:` directly, so surface the key as a
    # job-level env var and gate the eval step on it.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Ensure rolldown Linux binding
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" \
            || npm install --no-save @rolldown/binding-linux-x64-gnu@$(node -p "require('./package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu'] || require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")

      # Only runs the single live-eval spec, and only when the secret is present.
      # When OPENAI_API_KEY is unset this step is skipped entirely, so a missing
      # secret can never break CI.
      - name: Ask AI live model evals
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          RUN_ASK_AI_LIVE_EVALS: "1"
        run: npx vitest run app/lib/ask-ai/__tests__/live-model-evals.test.ts

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Ensure rolldown Linux binding
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" \
            || npm install --no-save @rolldown/binding-linux-x64-gnu@$(node -p "require('./package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu'] || require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Install the Chromium *browser* only. We deliberately do NOT use
      # `--with-deps` here: that shells out to apt, which intermittently hangs for
      # the full job budget on hosted runners, and ubuntu-latest already ships the
      # libraries Chromium needs. The browser download (fast, reliable CDN) is
      # wrapped in a bounded retry; on a cache hit it's skipped entirely.
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            for attempt in 1 2 3; do
              echo "playwright install chromium (attempt ${attempt})"
              timeout 180 npx playwright install chromium && break
              [ "${attempt}" = "3" ] && { echo "::error::browser install failed after 3 attempts"; exit 1; }
              echo "::warning::browser install attempt ${attempt} timed out/failed; retrying"
              sleep 5
            done
          fi

      # Playwright's webServer (playwright.config.ts) boots `npm run dev` with
      # NEXT_PUBLIC_PLAYWRIGHT_TEST_MODE=1, which opens the onboarding gate,
      # injects the test wallet, and serves mock data — so this needs neither a
      # Convex deployment nor a SIWE token. Scoped to the deterministic specs:
      #   - portfolio-routing: the portfolio page renders its product account tabs,
      #     and the old /dashboard and /rewards routes redirect to /portfolio.
      #   - borrow-detail-routes: every borrow detail route family renders without
      #     a runtime error (guards the hydration regression fixed in
      #     responsive-detail-action.tsx).
      # Both are JSON-import-free (the JSON fixture in action-pages/route-performance
      # trips Playwright's transform hook) and free of timing/pixel assertions.
      # onboarding.spec.ts stays out (needs real auth + Convex).
      - name: E2E smoke (test-mode routes render)
        run: npx playwright test --project=chromium tests/e2e/portfolio-routing.spec.ts tests/e2e/borrow-detail-routes.spec.ts tests/e2e/locale-overflow.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

# NOTE: CI's required gate is `lint` + the sharded `test (N/2)` jobs — format +
# security + lint + typecheck, plus the full unit/integration suite (vitest,
# sharded) — run on every PR into main and on push to main. `e2e-smoke` is a
# scoped Playwright smoke (see the step comment) kept as a separate, non-required
# job for now; promote it to a required check once it has proven stable.
# `ask-ai-live-evals` is likewise a separate, non-required job — it calls a real
# model and only runs when the `OPENAI_API_KEY` repo secret is set. The
# timing/pixel-sensitive e2e suites (route-performance, app-audit) and
# onboarding.spec.ts remain local-only: they need a running Convex backend and/or
# a signed-in wallet, which CI does not provision. Run them against `npm run dev`
# (NEXT_PUBLIC_PLAYWRIGHT_TEST_MODE=1 + a SIWE token + `npx convex dev`).

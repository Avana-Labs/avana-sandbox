name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rolldown Linux binding
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" \
            || npm install --no-save @rolldown/binding-linux-x64-gnu@$(node -p "require('./package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu'] || require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

# NOTE: The Playwright e2e (app-audit / route-performance) suites are intentionally not
# run in CI. They drive the authenticated app, which requires a running Convex backend and
# a signed-in wallet (the onboarding gate blocks unauthenticated routes) — neither of which
# CI provisions. Run them locally against `npm run dev` (NEXT_PUBLIC_PLAYWRIGHT_TEST_MODE=1
# + a SIWE token + a local `npx convex dev`). CI keeps the deterministic gates: typecheck
# + the full unit/integration suite (`npm test`).

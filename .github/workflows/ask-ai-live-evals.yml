name: Ask AI paid evaluations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ask-ai-paid-evals
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bounded model evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_ASK_AI_LIVE_EVALS: "1"
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY is required'; exit 1; }
          set -o pipefail
          npx vitest run app/lib/ask-ai/__tests__/live-model-evals.test.ts --maxWorkers=1 2>&1 | tee ask-ai-evals.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ask-ai-evaluation-evidence
          path: ask-ai-evals.log
          retention-days: 14
